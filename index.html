<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数字遗产点云博物馆</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>

body{
margin:0;
background:#000406;
overflow:hidden;
font-family:"Noto Serif SC",serif;
}

canvas{display:block}

/* 标题 */

.titlePanel{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
padding:14px 28px;
border-radius:16px;
background:rgba(0,0,0,0.35);
backdrop-filter:blur(10px);
}

.titleMain{
font-size:30px;
color:#f6c343;
letter-spacing:4px;
text-shadow:0 0 10px rgba(246,195,67,0.9);
}

.titleSub{
font-size:12px;
color:#6fd7ff;
letter-spacing:3px;
text-align:center;
}


/* 卡片 */

.card{
background:rgba(10,20,25,0.35);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-radius:16px;
padding:24px;
position:fixed;
overflow:hidden;
}

/* 左侧代码卡片 */

.codeCard{
top:120px;
left:30px;
width:420px;
height:calc(100vh - 200px);
color:#7df7ff;
font-size:12px;
}

/* 右侧介绍卡片 */

.infoCard{
top:120px;
right:30px;
width:420px;
height:calc(100vh - 200px);
color:#9fd9ff;
}

.cardTitle{
font-size:24px;
color:#ffd15c;
margin-bottom:18px;
letter-spacing:2px;
}

.cardContent{
line-height:1.7;
white-space:pre-wrap;
}


/* 隐藏滚动条 */

.card::-webkit-scrollbar{
display:none;
}

pre::-webkit-scrollbar{
display:none;
}

/* 摄像头 */

.cameraPanel{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
width:220px;
height:150px;
border-radius:12px;
overflow:hidden;
background:rgba(0,0,0,0.3);
backdrop-filter:blur(8px);
}

/* 按钮 */

.btn{
margin-top:16px;
padding:8px 20px;
border-radius:10px;
background:linear-gradient(135deg,#ffd15c,#39d7ff);
color:black;
font-weight:bold;
cursor:pointer;
}

</style>
</head>

<body>

<div class="titlePanel">

<div class="titleMain">
数字遗产点云博物馆
</div>

<div class="titleSub">
Digital Heritage Point Cloud Museum
</div>

</div>


<!-- 左侧代码卡片 -->

<div class="card codeCard">

<div class="cardTitle">
系统HTML代码
</div>

<pre id="codeText"></pre>

</div>


<!-- 右侧文物卡片 -->

<div class="card infoCard">

<div class="cardTitle">
戴金面罩人头像
</div>

<div id="artifactText" class="cardContent"></div>

<button id="rotateBtn" class="btn">
展示
</button>

</div>


<!-- 摄像头 -->

<div class="cameraPanel">

<canvas id="trackCanvas" class="absolute inset-0 z-20 pointer-events-none"></canvas>

<video id="video" autoplay muted class="w-full h-full object-cover opacity-40 grayscale"></video>

</div>


<div id="app"></div>


<script type="importmap">
{
"imports":{
"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}
}
</script>


<script type="module">

import * as THREE from 'three'
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js'
import {MeshSurfaceSampler} from 'three/addons/math/MeshSurfaceSampler.js'
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js'
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js'
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js'



const CONFIG={

particleCount:200000,

models:['mask.obj','people.obj'],

colors:{

gold:0xffd700, // 金色粒子

cyan:0x00ffff  // 青色粒子

}

}



let scene,camera,renderer,composer
let particles,shaderMaterial

let targetScale=1

let currentIdx=0

let interactionMode=false

let rotateActive=true

let mouseTrail=[]



init()

function init(){

scene=new THREE.Scene()

camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000)

camera.position.z=12

renderer=new THREE.WebGLRenderer()

renderer.setSize(innerWidth,innerHeight)

renderer.toneMapping=THREE.ReinhardToneMapping
renderer.toneMappingExposure=0.85

document.getElementById("app").appendChild(renderer.domElement)


const renderPass=new RenderPass(scene,camera)

const bloomPass=new UnrealBloomPass(
new THREE.Vector2(innerWidth,innerHeight),
0.45,
0.3,
0.9
)

composer=new EffectComposer(renderer)

composer.addPass(renderPass)
composer.addPass(bloomPass)



shaderMaterial=new THREE.ShaderMaterial({

uniforms:{
uTime:{value:0},
uMorph:{value:0},

uColorCyan:{value:new THREE.Color(CONFIG.colors.cyan)}, // 青色粒子
uColorGold:{value:new THREE.Color(CONFIG.colors.gold)}  // 金色粒子
},

vertexShader:`

uniform float uTime;
uniform float uMorph;

attribute vec3 targetPos;

varying float vY;

void main(){

vec3 pos=mix(position,targetPos,uMorph);

pos.y+=sin(uTime+position.x)*0.1*(1.0-uMorph);

vY=pos.y;

vec4 mv=modelViewMatrix*vec4(pos,1.0);

gl_PointSize=2.5*(10.0/-mv.z);

gl_Position=projectionMatrix*mv;

}

`,

fragmentShader:`

uniform vec3 uColorCyan;
uniform vec3 uColorGold;

varying float vY;

void main(){

float grad=clamp(vY*0.25+0.5,0.0,1.0);

vec3 color=mix(uColorCyan,uColorGold,grad);

color=pow(color,vec3(0.8));

gl_FragColor=vec4(color,0.85);

}

`,

transparent:true,
blending:THREE.AdditiveBlending,
depthTest:false

})


const geo=new THREE.BufferGeometry()

const pos=new Float32Array(CONFIG.particleCount*3)

const tar=new Float32Array(CONFIG.particleCount*3)

for(let i=0;i<pos.length;i++){

pos[i]=(Math.random()-0.5)*20
tar[i]=pos[i]

}

geo.setAttribute("position",new THREE.BufferAttribute(pos,3))
geo.setAttribute("targetPos",new THREE.BufferAttribute(tar,3))

particles=new THREE.Points(geo,shaderMaterial)

scene.add(particles)



loadModel(CONFIG.models[0])



window.addEventListener("mousemove",e=>{

if(!interactionMode)return

const rot=(e.clientX/innerWidth-0.5)*Math.PI*0.5

gsap.to(particles.rotation,{y:rot,duration:1})

mouseTrail.push({x:e.clientX,y:e.clientY,time:Date.now()})

})


window.addEventListener("wheel",e=>{

targetScale=THREE.MathUtils.clamp(targetScale-e.deltaY*0.0012,0.4,3.5)

})


window.addEventListener("dblclick",toggleModel)


window.addEventListener("mousedown",e=>{

if(e.button===1){

interactionMode=!interactionMode

}

})


document.getElementById("rotateBtn").onclick=()=>{

interactionMode=false

rotateActive=!rotateActive

document.getElementById("rotateBtn").innerText=
rotateActive?"停止展示":"展示"

}



setupCamera()

animate()

}



function loadModel(url){

const loader=new OBJLoader()

loader.load(url,obj=>{

let mesh

obj.traverse(c=>{if(c.isMesh)mesh=c})

mesh.geometry.center()

mesh.geometry.computeBoundingBox()

const box=mesh.geometry.boundingBox

const size=new THREE.Vector3()

box.getSize(size)

const scale=7/Math.max(size.x,size.y,size.z)

const sampler=new MeshSurfaceSampler(mesh).build()

const temp=new THREE.Vector3()

const attr=particles.geometry.attributes.targetPos

for(let i=0;i<CONFIG.particleCount;i++){

sampler.sample(temp)

attr.setXYZ(i,temp.x*scale,temp.y*scale,temp.z*scale)

}

attr.needsUpdate=true

gsap.to(shaderMaterial.uniforms.uMorph,{value:1,duration:2})

})

}



function toggleModel(){

gsap.to(shaderMaterial.uniforms.uMorph,{

value:0,

duration:0.8,

onComplete:()=>{

currentIdx=(currentIdx+1)%CONFIG.models.length

loadModel(CONFIG.models[currentIdx])

}

})

}



async function setupCamera(){

try{

const stream=await navigator.mediaDevices.getUserMedia({video:true})

video.srcObject=stream

}catch{}

}



function animate(){

requestAnimationFrame(animate)

shaderMaterial.uniforms.uTime.value+=0.015

particles.scale.lerp(new THREE.Vector3(targetScale,targetScale,targetScale),0.1)

if(!interactionMode && rotateActive){

particles.rotation.y+=0.006

}


const canvas=document.getElementById("trackCanvas")
const ctx=canvas.getContext("2d")

canvas.width=220
canvas.height=150

mouseTrail=mouseTrail.filter(p=>Date.now()-p.time<5000)

ctx.clearRect(0,0,220,150)

if(mouseTrail.length>1){

ctx.beginPath()

ctx.strokeStyle="cyan"

mouseTrail.forEach((p,i)=>{

const x=(p.x/innerWidth)*220
const y=(p.y/innerHeight)*150

if(i==0)ctx.moveTo(x,y)
else ctx.lineTo(x,y)

})

ctx.stroke()

}

composer.render()

}



/* 无限循环打字 */

function infiniteType(el,text,speed){

let content=text+text

let i=0

function type(){

el.innerText=content.substring(i,i+text.length)

i++

if(i>=text.length)i=0

setTimeout(type,speed)

}

type()

}



const intro=`三星堆戴金面罩人头像是三星堆遗址出土的重要文物之一……（此处可继续扩展1000字）`



infiniteType(
document.getElementById("artifactText"),
intro,
30
)



setTimeout(()=>{

infiniteType(
document.getElementById("codeText"),
document.documentElement.outerHTML,
2
)

},2000)



</script>

</body>
</html>
